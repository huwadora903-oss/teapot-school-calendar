name: Deploy calendar browser demo
on:
  push:
    branches: [main]
    paths: ['pages/**', 'public/index.html', 'demo/**', 'scripts/build-pages.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build browser-storage demo
        run: python3 scripts/build-pages.py
      - name: Check JavaScript syntax
        run: node --check pages/browser-storage.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
