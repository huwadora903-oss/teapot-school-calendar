services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-teapot_calendar}
      DB_USER: ${DB_USER:-calendar}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CALENDAR_READ_ONLY: ${CALENDAR_READ_ONLY:-0}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: ${DB_NAME:-teapot_calendar}
      MARIADB_USER: ${DB_USER:-calendar}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - calendar-db:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  calendar-db:
