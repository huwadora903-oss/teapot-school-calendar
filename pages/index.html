                    if (calDatePickerViewYear === year) calRenderDatePicker(false);
                })
                .catch(function () {
                    calDatePickerHolidayCache[year] = {};
                });
        }

        function calRenderDatePicker(shouldFocus) {
            var title = document.getElementById('cal-date-picker-title');
            var grid = document.getElementById('cal-date-grid');
            var input = document.getElementById('cal-f-date');
            if (!title) return;
            if (!grid) return;
            if (!input) return;

            title.textContent = calDatePickerViewYear + '年' + (calDatePickerViewMonth + 1) + '月';
            var first = new Date(calDatePickerViewYear, calDatePickerViewMonth, 1);
            var start = new Date(calDatePickerViewYear, calDatePickerViewMonth, 1 - first.getDay());
            var selectedKey = input.value;
            var todayKey = calPickerDateKey(new Date());
            var keepGridFocus = grid.contains(document.activeElement);
            var html = '';

            for (var i = 0; i < 42; i += 1) {
                var day = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
                var dateKey = calPickerDateKey(day);
                var classes = ['cal-date-day'];
                if (!calPickerSameMonth(day, calDatePickerViewYear, calDatePickerViewMonth)) classes.push('other-month');
                if (day.getDay() === 6) classes.push('weekend-sat');
                if (day.getDay() === 0) classes.push('weekend-sun');
                if (dateKey === todayKey) classes.push('today');
                if (dateKey === selectedKey) classes.push('selected');

                var holidays = calDatePickerHolidayCache[day.getFullYear()];
                var holidayName = '';
                if (holidays) holidayName = holidays[dateKey] || '';
                if (holidayName) classes.push('holiday');

                var ariaLabel = day.getFullYear() + '年' + (day.getMonth() + 1) + '月' + day.getDate() + '日';
                if (holidayName) ariaLabel += ' ' + holidayName;
                html += '<button type="button" class="' + classes.join(' ') + '" role="gridcell" tabindex="-1" data-date="' + dateKey + '" aria-label="' + calEscapeAttr(ariaLabel) + '"';
                if (dateKey === selectedKey) html += ' aria-selected="true"';
                html += '>' + day.getDate() + '</button>';
            }

            grid.innerHTML = html;
            var focusButton = null;
            if (calDatePickerFocusKey) focusButton = grid.querySelector('[data-date="' + calDatePickerFocusKey + '"]');
            if (!focusButton) {
                if (selectedKey) focusButton = grid.querySelector('[data-date="' + selectedKey + '"]');
            }
            if (!focusButton) focusButton = grid.querySelector('[data-date="' + todayKey + '"]');
            if (!focusButton) focusButton = grid.querySelector('.cal-date-day:not(.other-month)');
            if (focusButton) {
                focusButton.tabIndex = 0;
                if (shouldFocus) setTimeout(function () { focusButton.focus(); }, 10);
                else if (keepGridFocus) setTimeout(function () { focusButton.focus(); }, 10);
            }

            calLoadDatePickerHolidays(calDatePickerViewYear);
            var previousMonth = calDatePickerViewMonth === 0 ? 11 : calDatePickerViewMonth - 1;
            var previousYear = calDatePickerViewMonth === 0 ? calDatePickerViewYear - 1 : calDatePickerViewYear;
            var nextMonth = calDatePickerViewMonth === 11 ? 0 : calDatePickerViewMonth + 1;
            var nextYear = calDatePickerViewMonth === 11 ? calDatePickerViewYear + 1 : calDatePickerViewYear;
            calLoadDatePickerHolidays(previousYear);
            calLoadDatePickerHolidays(nextYear);
        }

        function calPositionDatePicker() {
            var control = document.getElementById('cal-date-control');
            var trigger = document.getElementById('cal-date-trigger');
            var popup = document.getElementById('cal-date-popup');
            if (!control) return;
            if (!trigger) return;
            if (!popup) return;
            if (!control.classList.contains('open')) return;

            var viewportMargin = 12;
            var popupGap = 7;
            var triggerRect = trigger.getBoundingClientRect();
            var popupRect = popup.getBoundingClientRect();
            var popupWidth = Math.min(360, window.innerWidth - viewportMargin * 2);
            popup.style.width = popupWidth + 'px';
            popupRect = popup.getBoundingClientRect();

            var left = triggerRect.left;
            if (left + popupRect.width > window.innerWidth - viewportMargin) {
                left = window.innerWidth - viewportMargin - popupRect.width;
            }
            if (left < viewportMargin) left = viewportMargin;

            var availableBelow = window.innerHeight - triggerRect.bottom - viewportMargin - popupGap;
            var availableAbove = triggerRect.top - viewportMargin - popupGap;
            var openUp = popupRect.height > availableBelow;
            if (openUp) {
                if (availableAbove <= availableBelow) openUp = false;
            }

            var top = triggerRect.bottom + popupGap;
            popup.classList.remove('open-up');
            if (openUp) {
                top = triggerRect.top - popupRect.height - popupGap;
                popup.classList.add('open-up');
            }
            if (top < viewportMargin) top = viewportMargin;
            if (top + popupRect.height > window.innerHeight - viewportMargin) {
                top = Math.max(viewportMargin, window.innerHeight - viewportMargin - popupRect.height);
            }

            popup.style.left = Math.round(left) + 'px';
            popup.style.top = Math.round(top) + 'px';
        }

        function calSetDatePickerOpen(isOpen, focusDay) {
            var control = document.getElementById('cal-date-control');
            var trigger = document.getElementById('cal-date-trigger');
            var input = document.getElementById('cal-f-date');
            var popup = document.getElementById('cal-date-popup');
            var portal = document.getElementById('cal-picker-portal');
            if (!control) return;
            if (!trigger) return;
            if (!input) return;
            if (!popup) return;
            if (!portal) return;
            if (isOpen) {
                calSetTypeDropdownOpen(false, false);
                calSetPeriodDropdownOpen(false, false);
                calCloseTimePickers();
                if (popup.parentElement !== portal) portal.appendChild(popup);
                var selectedDate = calPickerDateFromKey(input.value);
                var baseDate = selectedDate || new Date();
                calDatePickerViewYear = baseDate.getFullYear();
                calDatePickerViewMonth = baseDate.getMonth();
                calDatePickerFocusKey = calPickerDateKey(baseDate);
                calRenderDatePicker(false);
                control.classList.add('open');
                trigger.setAttribute('aria-expanded', 'true');
                portal.setAttribute('aria-hidden', 'false');
                calPositionDatePicker();
                window.requestAnimationFrame(function () {
                    calPositionDatePicker();
                    popup.classList.add('portal-open');
                });
                if (focusDay) {
                    setTimeout(function () {
                        calRenderDatePicker(true);
                    }, 20);
                }
            } else {
                control.classList.remove('open');
                trigger.setAttribute('aria-expanded', 'false');
                popup.classList.remove('portal-open');
                portal.setAttribute('aria-hidden', 'true');
            }
        }

        function calChangeDatePickerMonth(offset) {
            var next = new Date(calDatePickerViewYear, calDatePickerViewMonth + offset, 1);
            calDatePickerViewYear = next.getFullYear();
            calDatePickerViewMonth = next.getMonth();
            calDatePickerFocusKey = calPickerDateKey(next);
            calRenderDatePicker(true);
        }

        function calChooseCustomDate(dateKey) {
            var input = document.getElementById('cal-f-date');
            if (!input) return;
            input.value = dateKey;
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
            calSyncDateControl();
            calSetDatePickerOpen(false, false);
            var trigger = document.getElementById('cal-date-trigger');
            if (trigger) trigger.focus();
        }

        function calChooseTodayFromPicker() {
            calChooseCustomDate(calPickerDateKey(new Date()));
        }

        function calMoveDatePickerFocus(currentKey, key) {
            var current = calPickerDateFromKey(currentKey);
            if (!current) return;
            var next = new Date(current.getFullYear(), current.getMonth(), current.getDate());
            if (key === 'ArrowLeft') next.setDate(next.getDate() - 1);
            else if (key === 'ArrowRight') next.setDate(next.getDate() + 1);
            else if (key === 'ArrowUp') next.setDate(next.getDate() - 7);
            else if (key === 'ArrowDown') next.setDate(next.getDate() + 7);
            else if (key === 'Home') next.setDate(next.getDate() - next.getDay());
            else if (key === 'End') next.setDate(next.getDate() + (6 - next.getDay()));
            else if (key === 'PageUp') next.setMonth(next.getMonth() - 1);
            else if (key === 'PageDown') next.setMonth(next.getMonth() + 1);
            else return;
            calDatePickerViewYear = next.getFullYear();
            calDatePickerViewMonth = next.getMonth();
            calDatePickerFocusKey = calPickerDateKey(next);
            calRenderDatePicker(true);
        }

        function calCloseCustomControls() {
            calSetTypeDropdownOpen(false, false);
            calSetDatePickerOpen(false, false);
            calSetPeriodDropdownOpen(false, false);
            calCloseTimePickers();
            var portal = document.getElementById('cal-picker-portal');
            if (portal) portal.setAttribute('aria-hidden', 'true');
        }

        function calInitCustomFormControls() {
            if (calCustomControlsInitialized) return;
            calCustomControlsInitialized = true;

            var typeControl = document.getElementById('cal-type-control');
            var typeTrigger = document.getElementById('cal-type-trigger');
            var typePopup = document.getElementById('cal-type-popup');
            var dateControl = document.getElementById('cal-date-control');
            var dateTrigger = document.getElementById('cal-date-trigger');
            var datePopup = document.getElementById('cal-date-popup');
            var dateGrid = document.getElementById('cal-date-grid');
            var datePrev = document.getElementById('cal-date-prev');
            var dateNext = document.getElementById('cal-date-next');
            var dateToday = document.getElementById('cal-date-today');
            var periodControl = document.getElementById('cal-period-control');
            var periodTrigger = document.getElementById('cal-period-trigger');
            var periodPopup = document.getElementById('cal-period-popup');
            var pickerPortal = document.getElementById('cal-picker-portal');

            calSyncTypeControl();
            calSyncDateControl();
            calSyncPeriodControl();
            calSyncTimeControl('start');
            calSyncTimeControl('end');

            if (typeTrigger) {
                typeTrigger.addEventListener('click', function () {
                    var isOpen = typeControl.classList.contains('open');
                    calSetTypeDropdownOpen(!isOpen, !isOpen);
                });
                typeTrigger.addEventListener('keydown', function (event) {
                    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                        event.preventDefault();
                        calSetTypeDropdownOpen(true, true);
                    } else if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        var isOpen = typeControl.classList.contains('open');
                        calSetTypeDropdownOpen(!isOpen, !isOpen);
                    } else if (event.key === 'Escape') {
                        calSetTypeDropdownOpen(false, false);
                    }
                });
            }

            if (typePopup) {
                typePopup.addEventListener('click', function (event) {
                    var option = event.target.closest('.cal-select-option');
                    if (!option) return;
                    calChooseType(option.dataset.value);
                });
                typePopup.addEventListener('keydown', function (event) {
                    var option = event.target.closest('.cal-select-option');
                    if (!option) return;
                    var options = Array.from(typePopup.querySelectorAll('.cal-select-option'));
                    var index = options.indexOf(option);
                    if (event.key === 'ArrowDown') {
                        event.preventDefault();
                        options[(index + 1) % options.length].focus();
                    } else if (event.key === 'ArrowUp') {
                        event.preventDefault();
                        options[(index - 1 + options.length) % options.length].focus();
                    } else if (event.key === 'Home') {
                        event.preventDefault();
                        options[0].focus();
                    } else if (event.key === 'End') {
                        event.preventDefault();
                        options[options.length - 1].focus();
                    } else if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        calChooseType(option.dataset.value);
                    } else if (event.key === 'Escape') {
                        event.preventDefault();
                        calSetTypeDropdownOpen(false, false);
                        typeTrigger.focus();
                    } else if (event.key === 'Tab') {
                        calSetTypeDropdownOpen(false, false);
                    }
                });
                calAddVerticalDropdownWheelSelection(typePopup, '.cal-select-option', calChooseType);
            }

            if (periodTrigger) {
                periodTrigger.addEventListener('click', function () {
                    var isOpen = periodControl.classList.contains('open');
                    calSetPeriodDropdownOpen(!isOpen, !isOpen);
                });
                periodTrigger.addEventListener('keydown', function (event) {
                    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                        event.preventDefault();
                        calSetPeriodDropdownOpen(true, true);
                    } else if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        var isOpen = periodControl.classList.contains('open');
                        calSetPeriodDropdownOpen(!isOpen, !isOpen);
                    } else if (event.key === 'Escape') {
                        calSetPeriodDropdownOpen(false, false);
                    }
                });
            }

            if (periodPopup) {
                periodPopup.addEventListener('click', function (event) {
                    var option = event.target.closest('.cal-period-option');
                    if (!option) return;
                    event.stopPropagation();
                    calChoosePeriod(option.dataset.value);
                });
                periodPopup.addEventListener('keydown', function (event) {
                    var option = event.target.closest('.cal-period-option');
                    if (!option) return;
                    var options = Array.from(periodPopup.querySelectorAll('.cal-period-option'));
                    var index = options.indexOf(option);
                    if (event.key === 'ArrowDown') {
                        event.preventDefault();
                        options[(index + 1) % options.length].focus();
                    } else if (event.key === 'ArrowUp') {
                        event.preventDefault();
                        options[(index - 1 + options.length) % options.length].focus();
                    } else if (event.key === 'Home') {
                        event.preventDefault();
                        options[0].focus();
                    } else if (event.key === 'End') {
                        event.preventDefault();
                        options[options.length - 1].focus();
                    } else if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        calChoosePeriod(option.dataset.value);
                    } else if (event.key === 'Escape') {
                        event.preventDefault();
                        calSetPeriodDropdownOpen(false, false);
                        periodTrigger.focus();
                    }
                });
                calAddVerticalDropdownWheelSelection(periodPopup, '.cal-period-option', calChoosePeriod);
            }

            calTimePickerKeys.forEach(function (key) {
                var config = calGetTimePickerConfig(key);
                if (!config) return;
                var trigger = document.getElementById(config.triggerId);
                var popup = document.getElementById(config.popupId);
                if (trigger) {
                    trigger.addEventListener('click', function () {
                        var control = document.getElementById(config.controlId);
                        if (!control) return;
                        var isOpen = control.classList.contains('open');
                        calSetTimePickerOpen(key, !isOpen, !isOpen);
                    });
                    trigger.addEventListener('keydown', function (event) {
                        if (event.key === 'ArrowDown' || event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            calSetTimePickerOpen(key, true, true);
                        } else if (event.key === 'Escape') {
                            calSetTimePickerOpen(key, false, false);
                        }
                    });
                }
                if (popup) {
                    popup.addEventListener('click', function (event) {
                        var option = event.target.closest('.cal-time-option');
                        if (!option) return;
                        if (option.disabled) return;
                        event.stopPropagation();
                        calChooseTimePart(key, option.dataset.part, option.dataset.value);
                    });
                    ['hour', 'minute'].forEach(function (part) {
                        var listId = part === 'hour' ? config.hoursId : config.minutesId;
                        var list = document.getElementById(listId);
                        if (!list) return;
                        var wheelState = { inputVersion: 0, scrollTimer: null, suppressNextScroll: false, lastDirection: 0, lastScrollTop: list.scrollTop };
                        function scheduleWheelValueSync() {
                            if (wheelState.suppressNextScroll) {
                                wheelState.suppressNextScroll = false;
                                return;
                            }
                            if (wheelState.scrollTimer) window.clearTimeout(wheelState.scrollTimer);
                            var scheduledVersion = wheelState.inputVersion;
                            wheelState.scrollTimer = window.setTimeout(function () {
                                if (scheduledVersion !== wheelState.inputVersion) return;
                                wheelState.suppressNextScroll = calSelectNearestTimeWheelValue(key, part, wheelState.lastDirection);
                            }, 50);
                        }
                        function cancelPendingWheelSnap() {
                            wheelState.inputVersion += 1;
                            wheelState.suppressNextScroll = false;
                            if (wheelState.scrollTimer) window.clearTimeout(wheelState.scrollTimer);
                            wheelState.scrollTimer = null;
                        }
                        list.addEventListener('wheel', function (event) {
                            cancelPendingWheelSnap();
                            if (!calIsDiscreteMouseWheel(event)) return;
                            if (event.deltaY === 0) return;
                            event.preventDefault();
                            var direction = event.deltaY > 0 ? 1 : -1;
                            wheelState.suppressNextScroll = calMoveTimeWheelByStep(key, part, direction);
                        }, { passive: false });
                        list.addEventListener('touchstart', function () {
                            cancelPendingWheelSnap();
                        }, { passive: true });
                        list.addEventListener('pointerdown', function () {
                            cancelPendingWheelSnap();
                        }, { passive: true });
                        list.addEventListener('scroll', function () {
                            var scrollDelta = list.scrollTop - wheelState.lastScrollTop;
                            if (Math.abs(scrollDelta) > 0.25) wheelState.lastDirection = scrollDelta > 0 ? 1 : -1;
                            wheelState.lastScrollTop = list.scrollTop;
                            scheduleWheelValueSync();
                        }, { passive: true });
                    });
                    popup.addEventListener('keydown', function (event) {
                        var option = event.target.closest('.cal-time-option');
                        if (!option) return;
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            calChooseTimePart(key, option.dataset.part, option.dataset.value);
                            return;
                        }
                        if (event.key === 'Escape') {
                            event.preventDefault();
                            calSetTimePickerOpen(key, false, false);
                            trigger.focus();
                            return;
                        }
                        if (event.key === 'ArrowDown' || event.key === 'ArrowUp' || event.key === 'Home' || event.key === 'End') {
                            event.preventDefault();
                            var selector = '.cal-time-option[data-part="' + option.dataset.part + '"]';
                            var options = Array.from(popup.querySelectorAll(selector));
                            var index = options.indexOf(option);
                            var nextIndex = index;
                            if (event.key === 'ArrowDown') nextIndex = (index + 1) % options.length;
                            else if (event.key === 'ArrowUp') nextIndex = (index - 1 + options.length) % options.length;
                            else if (event.key === 'Home') nextIndex = 0;
                            else if (event.key === 'End') nextIndex = options.length - 1;
                            var attempts = 0;
                            while (options[nextIndex].disabled) {
                                attempts += 1;
                                if (attempts >= options.length) return;
                                if (event.key === 'ArrowUp') nextIndex = Math.max(0, nextIndex - 1);
                                else nextIndex = Math.min(options.length - 1, nextIndex + 1);
                            }
                            options[nextIndex].focus();
                            calSetTimeWheelValue(key, option.dataset.part, options[nextIndex].dataset.value);
                            calCenterTimeWheel(key, option.dataset.part, 'smooth');
                        }
                    });
                }
            });

            if (dateTrigger) {
                dateTrigger.addEventListener('click', function () {
                    var isOpen = dateControl.classList.contains('open');
                    calSetDatePickerOpen(!isOpen, !isOpen);
                });
                dateTrigger.addEventListener('keydown', function (event) {
                    if (event.key === 'ArrowDown' || event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        calSetDatePickerOpen(true, true);
                    } else if (event.key === 'Escape') {
                        calSetDatePickerOpen(false, false);
                    }
                });
            }

            if (datePrev) datePrev.addEventListener('click', function () { calChangeDatePickerMonth(-1); });
            if (dateNext) dateNext.addEventListener('click', function () { calChangeDatePickerMonth(1); });
            if (dateToday) dateToday.addEventListener('click', calChooseTodayFromPicker);

            if (dateGrid) {
                dateGrid.addEventListener('click', function (event) {
                    var day = event.target.closest('.cal-date-day');
                    if (!day) return;
                    calChooseCustomDate(day.dataset.date);
                });
                dateGrid.addEventListener('keydown', function (event) {
                    var day = event.target.closest('.cal-date-day');
                    if (!day) return;
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        calChooseCustomDate(day.dataset.date);
                        return;
                    }
                    var navigationKey = event.key === 'ArrowLeft' || event.key === 'ArrowRight' || event.key === 'ArrowUp' || event.key === 'ArrowDown' || event.key === 'Home' || event.key === 'End' || event.key === 'PageUp' || event.key === 'PageDown';
                    if (navigationKey) {
                        event.preventDefault();
                        calMoveDatePickerFocus(day.dataset.date, event.key);
                    } else if (event.key === 'Escape') {
                        event.preventDefault();
                        calSetDatePickerOpen(false, false);
                        dateTrigger.focus();
                    }
                });
            }

            document.addEventListener('click', function (event) {
                if (pickerPortal) {
                    if (pickerPortal.contains(event.target)) return;
                }
                for (var timeClickIndex = 0; timeClickIndex < calTimePickerKeys.length; timeClickIndex += 1) {
                    var timeClickConfig = calGetTimePickerConfig(calTimePickerKeys[timeClickIndex]);
                    if (timeClickConfig) {
                        var timeClickControl = document.getElementById(timeClickConfig.controlId);
                        if (timeClickControl) {
                            if (timeClickControl.contains(event.target)) return;
                        }
                    }
                }
                if (typeControl) {
                    if (!typeControl.contains(event.target)) calSetTypeDropdownOpen(false, false);
                }
                if (periodControl) {
                    if (!periodControl.contains(event.target)) calSetPeriodDropdownOpen(false, false);
                }
                if (dateControl) {
                    if (!dateControl.contains(event.target)) {
                        if (!datePopup.contains(event.target)) calSetDatePickerOpen(false, false);
                    }
                }
                calCloseTimePickers();
            });

            document.addEventListener('focusin', function (event) {
                if (pickerPortal) {
                    if (pickerPortal.contains(event.target)) return;
                }
                for (var timeFocusIndex = 0; timeFocusIndex < calTimePickerKeys.length; timeFocusIndex += 1) {
                    var timeFocusConfig = calGetTimePickerConfig(calTimePickerKeys[timeFocusIndex]);
                    if (timeFocusConfig) {
                        var timeFocusControl = document.getElementById(timeFocusConfig.controlId);
                        if (timeFocusControl) {
                            if (timeFocusControl.contains(event.target)) return;
                        }
                    }
                }
                if (typeControl) {
                    if (!typeControl.contains(event.target)) calSetTypeDropdownOpen(false, false);
                }
                if (periodControl) {
                    if (!periodControl.contains(event.target)) calSetPeriodDropdownOpen(false, false);
                }
                if (dateControl) {
                    if (!dateControl.contains(event.target)) {
                        if (!datePopup.contains(event.target)) calSetDatePickerOpen(false, false);
                    }
                }
                calCloseTimePickers();
            });

            window.addEventListener('resize', function () {
                calPositionDatePicker();
                calPositionPortalPopup('cal-period-control', 'cal-period-popup');
                calTimePickerKeys.forEach(function (key) {
                    var config = calGetTimePickerConfig(key);
                    if (config) calPositionPortalPopup(config.controlId, config.popupId);
                });
            });
            window.addEventListener('scroll', function () {
                calPositionDatePicker();
                calPositionPortalPopup('cal-period-control', 'cal-period-popup');
                calTimePickerKeys.forEach(function (key) {
                    var config = calGetTimePickerConfig(key);
                    if (config) calPositionPortalPopup(config.controlId, config.popupId);
                });
            }, true);
        }

        document.addEventListener('DOMContentLoaded', calInitCustomFormControls);

    </script>
</body>
