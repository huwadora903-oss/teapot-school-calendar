<!doctype html>
<html lang="ja">
<head>
<script src="browser-storage.js"></script>
<title>学校カレンダー</title>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.cal-status-locked {
            overflow: hidden;
            touch-action: none;
        }

        #cal-app {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Meiryo', sans-serif;
            background: #f0f4f8;
            padding: clamp(8px, 2vw, 14px);
            width: 100%;
            max-width: min(980px, 100%);
            margin: 0 auto;
            transition: background 0.3s ease;
        }

        #cal-app,
        #cal-app *,
        #cal-detail-overlay,
        #cal-detail-overlay *,
        #cal-status-overlay,
        #cal-status-overlay *,
        #cal-confirm-overlay,
        #cal-confirm-overlay * {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif !important;
            letter-spacing: 0;
        }

        #cal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        #cal-header h2 {
            font-size: clamp(14px, 3vw, 20px);
            color: #2c3e50;
            font-weight: 700;
            transition: color 0.3s;
        }

        #cal-btn-open {
            background: #3788d8;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: clamp(12px, 2.5vw, 14px);
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            white-space: nowrap;
        }

        #cal-btn-open:hover {
            background: #2563ae;
        }

        #cal-wrap {
            background: white;
            border-radius: 12px;
            padding: clamp(6px, 1.8vw, 20px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            width: 100%;
            overflow: hidden;
            transition: background 0.3s ease, box-shadow 0.3s ease, height 0.35s ease;
        }

        #cal-form-panel,
        #cal-wrap {
            scroll-margin-top: 90px;
        }

        #cal-form-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.4s ease, margin-bottom 0.4s ease, background 0.3s ease;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 0;
        }

        #cal-form-panel.open {
            max-height: 960px;
            padding: 20px;
            margin-bottom: 12px;
        }

        #cal-form-panel h3 {
            font-size: clamp(14px, 3vw, 18px);
            color: #2c3e50;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #cal-btn-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #999;
        }

        .cal-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 500px) {
            .cal-form-grid {
                grid-template-columns: 1fr;
            }
        }

        .cal-form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cal-form-group.full {
            grid-column: 1 / -1;
        }

        .cal-form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #555;
            transition: color 0.3s;
        }

        .cal-form-subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .cal-form-group input,
        .cal-form-group select,
        .cal-form-group textarea {
            border: 1.5px solid #dde3ea;
            border-radius: 7px;
            padding: 8px 10px;
            font-size: 14px;
            color: #2c3e50;
            outline: none;
            transition: border-color 0.2s, background 0.3s, color 0.3s;
            width: 100%;
            background: white;
        }

        .cal-form-group textarea {
            resize: vertical;
            min-height: 72px;
            line-height: 1.5;
            font-family: inherit;
        }

        .cal-form-group input:focus,
        .cal-form-group select:focus,
        .cal-form-group textarea:focus {
            border-color: #3788d8;
        }

        .cal-time-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .cal-time-tab {
            flex: 1;
            padding: 7px;
            border: 1.5px solid #dde3ea;
            border-radius: 7px;
            background: white;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-align: center;
            transition: all 0.2s;
        }

        .cal-time-tab.active {
            background: #3788d8;
            border-color: #3788d8;
            color: white;
        }

        #cal-period-suggestion {
            display: none;
            margin: 8px 0 10px;
            padding: 10px 12px;
            border: 1px solid #bfdbfe;
            border-radius: 9px;
            background: #eff6ff;
            color: #1e3a8a;
            font-size: 13px;
            line-height: 1.5;
        }

        #cal-period-suggestion.show {
            display: block;
        }

        #cal-period-suggestion.applied {
            border-color: #bbf7d0;
            background: #f0fdf4;
            color: #166534;
        }

        #cal-period-suggestion.missing {
            border-color: #fde68a;
            background: #fffbeb;
            color: #92400e;
        }

        .cal-period-suggestion-title {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .cal-period-suggestion-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #cal-period-suggestion-apply {
            border: none;
            border-radius: 7px;
            background: #3788d8;
            color: #ffffff;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .cal-period-auto-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .cal-color-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cal-color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: border-color 0.2s, transform 0.2s;
        }

        .cal-color-dot.selected {
            border-color: #2c3e50;
            transform: scale(1.15);
        }

        #cal-form-message {
            display: none;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            font-weight: 600;
            background: #fff0f0;
            color: #b83232;
            border: 1px solid #f2b8b8;
        }

        #cal-form-message.show {
            display: block;
        }

        .cal-form-actions {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        #cal-btn-submit {
            background: #3788d8;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        #cal-btn-submit:hover {
            background: #2563ae;
        }

        #cal-btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        #cal-btn-cancel {
            background: #f0f4f8;
            color: #555;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s, color 0.3s;
        }

        /* 備考欄ラベルのスタイル */
        #cal-memo-label-test {
            color: #e74c3c;
            font-weight: 700;
        }

        #cal-memo-label-assignment {
            color: #f39c12;
            font-weight: 700;
        }

        .fc,
        .fc button,
        .fc input,
        .fc select,
        .fc-event,
        .fc-event-title,
        .fc-col-header-cell,
        .fc-daygrid-day-number {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Meiryo', sans-serif !important;
        }

        .fc {
            font-size: clamp(10px, 1.8vw, 14px) !important;
        }

        .fc-toolbar-title {
            font-size: clamp(14px, 3vw, 20px) !important;
            font-weight: 700 !important;
            color: #2c3e50 !important;
            text-align: center !important;
            transition: color 0.3s;
        }

        .fc-button {
            background: #f5f8fc !important;
            border: 1px solid #dbe5ef !important;
            color: #2c3e50 !important;
            border-radius: 8px !important;
            box-shadow: none !important;
            font-size: clamp(10px, 2vw, 13px) !important;
            font-weight: 700 !important;
            padding: 5px 10px !important;
            line-height: 1.2 !important;
            transition: background 0.2s, border-color 0.2s, color 0.2s !important;
            text-transform: none !important;
        }

        .fc-button:hover,
        .fc-button:focus {
            background: #e8f2ff !important;
            border-color: #b9d8ff !important;
            color: #1f5f9f !important;
        }

        .fc-button:disabled {
            opacity: 0.5 !important;
        }

        .fc-today-button {
            background: #3788d8 !important;
            border-color: #3788d8 !important;
            color: white !important;
            min-width: 54px;
        }

        .fc-today-button:hover,
        .fc-today-button:focus {
            background: #2563ae !important;
            border-color: #2563ae !important;
            color: white !important;
        }

        .fc-prev-button,
        .fc-next-button {
            width: 36px;
            min-width: 36px;
            padding-left: 0 !important;
            padding-right: 0 !important;
        }

        .fc-prev-button .fc-icon,
        .fc-next-button .fc-icon {
            display: none !important;
        }

        .fc-prev-button::after {
            content: "<";
            font-size: 16px;
            font-weight: 800;
        }

        .fc-next-button::after {
            content: ">";
            font-size: 16px;
            font-weight: 800;
        }

        .fc-icon {
            font-family: inherit !important;
            font-size: 1em !important;
            line-height: 1 !important;
        }

        @media (max-width: 520px) {
            #cal-app {
                padding-left: 6px;
                padding-right: 6px;
            }

            #cal-wrap {
                padding: 6px;
                border-radius: 10px;
            }

            .fc-toolbar.fc-header-toolbar {
                margin-bottom: 0.5em !important;
            }

            .fc-button {
                padding: 3px 6px !important;
            }

            .fc-today-button {
                min-width: 50px;
            }

            .fc-prev-button,
            .fc-next-button {
                width: 32px;
                min-width: 32px;
            }

            .fc-daygrid-day-number {
                font-size: 11px !important;
                padding: 2px 3px !important;
            }

            .fc-daygrid-day-frame {
                min-height: 48px !important;
            }

            .fc-daygrid-event {
                margin-top: 1px !important;
                margin-bottom: 1px !important;
            }
        }

        .fc-daygrid-event {
            white-space: normal !important;
        }

        .fc-event-title {
            white-space: normal !important;
            word-break: break-all;
            line-height: 1.3;
            font-weight: 600;
        }

        /* 祝日 */
        #cal-app .cal-holiday {
            background: rgba(231, 76, 60, 0.10) !important;
        }

        #cal-app .fc-daygrid-day-number,
        #cal-app .fc-daygrid-day-number[data-holiday-name] {
            color: #2c3e50 !important;
        }

        #cal-app.dark .fc-daygrid-day-number,
        #cal-app.dark .fc-daygrid-day-number[data-holiday-name] {
            color: #e5e7eb !important;
        }

        /* 土日 */
        #cal-app .fc-daygrid-day.fc-day-other.cal-weekend-sat:not(.cal-holiday),
        #cal-app .fc-daygrid-day.fc-day-other .fc-daygrid-day-frame.cal-weekend-sat:not(.cal-holiday) {
            background: rgba(56, 139, 240, 0.035) !important;
        }

        #cal-app .fc-daygrid-day.fc-day-other.cal-weekend-sun:not(.cal-holiday),
        #cal-app .fc-daygrid-day.fc-day-other .fc-daygrid-day-frame.cal-weekend-sun:not(.cal-holiday) {
            background: rgba(231, 76, 60, 0.025) !important;
        }

        #cal-app .cal-weekend-sat:not(.cal-holiday),
        #cal-app .fc-daygrid-day-frame.cal-weekend-sat:not(.cal-holiday) {
            background: rgba(56, 139, 240, 0.08) !important;
        }

        #cal-app .cal-weekend-sun:not(.cal-holiday),
        #cal-app .fc-daygrid-day-frame.cal-weekend-sun:not(.cal-holiday) {
            background: rgba(231, 76, 60, 0.06) !important;
        }

        #cal-app .fc-daygrid-day.fc-day-other.cal-holiday,
        #cal-app .fc-daygrid-day.fc-day-other .fc-daygrid-day-frame.cal-holiday {
            background: rgba(231, 76, 60, 0.05) !important;
        }

        #cal-app .fc-daygrid-day-number[data-holiday-name]::after {
            content: ' ' attr(data-holiday-name);
            display: inline-block;
            margin-left: 4px;
            font-size: 0.72em;
            line-height: 1;
            color: #e74c3c;
            white-space: nowrap;
            vertical-align: middle;
        }

        #cal-app.dark .fc-daygrid-day-number[data-holiday-name]::after {
            color: #fecaca;
        }

        /* ダーク祝日 */
        #cal-app.dark .cal-holiday {
            background: rgba(239, 68, 68, 0.10) !important;
        }

        /* 時間割ビュー */
        #cal-app .fc-timegrid-slot {
            height: 40px;
        }

        #cal-app.dark .fc-timegrid-slot {
            background: #111827;
            border-color: #374151;
        }

        #cal-detail-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #cal-detail-overlay.show {
            display: flex;
        }

        #cal-detail-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 22px 20px 18px;
            max-width: 400px;
            width: 100%;
            max-height: 82vh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.22);
            position: relative;
            transition: background 0.3s, border-color 0.3s;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        #cal-detail-box h4 {
            font-size: 15px;
            color: #1e293b;
            margin-bottom: 16px;
            padding-right: 30px;
            font-weight: 700;
            line-height: 1.4;
        }

        #cal-detail-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            background: rgba(0, 0, 0, 0.06);
            border: none;
            border-radius: 50%;
            font-size: 15px;
            line-height: 28px;
            text-align: center;
            cursor: pointer;
            color: #64748b;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #cal-detail-close:hover {
            background: rgba(0, 0, 0, 0.12);
            color: #1e293b;
        }

        /* 予定カード（枠で囲む） */
        .cal-detail-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            transition: background 0.2s, border-color 0.3s;
        }

        .cal-detail-item:last-child {
            margin-bottom: 0;
        }

        .cal-detail-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 5px;
        }

        .cal-detail-info {
            flex: 1;
            min-width: 0;
        }

        .cal-detail-info .cal-item-title {
            font-size: 14px;
            font-weight: 700;
            color: #1e293b;
            word-break: break-word;
            transition: color 0.3s;
            line-height: 1.4;
        }

        .cal-detail-info .cal-item-sub {
            font-size: 11px;
            color: #64748b;
            margin-top: 3px;
            transition: color 0.3s;
        }

        /* 備考表示エリア */
        .cal-item-memo {
            margin-top: 7px;
            padding: 7px 10px;
            border-radius: 7px;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .cal-item-memo.memo-test {
            background: rgba(231, 76, 60, 0.08);
            color: #c0392b;
            border-left: 3px solid #e74c3c;
        }

        .cal-item-memo.memo-assignment {
            background: rgba(243, 156, 18, 0.10);
            color: #9a7000;
            border-left: 3px solid #f39c12;
        }

        .cal-item-memo.memo-other {
            background: rgba(0, 0, 0, 0.04);
            color: #555;
            border-left: 3px solid #aaa;
        }

        .cal-item-memo-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.03em;
            opacity: 0.75;
            margin-bottom: 2px;
            display: block;
        }

        .cal-detail-edit,
        .cal-detail-delete {
            border-radius: 7px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            align-self: flex-start;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            border: 1px solid transparent;
        }

        .cal-detail-edit {
            background: #eff6ff;
            color: #1d4ed8;
            border-color: #bfdbfe;
        }

        .cal-detail-edit:hover {
            background: #dbeafe;
        }

        .cal-detail-delete {
            background: #fff0f0;
            color: #b83232;
            border-color: #fecaca;
        }

        .cal-detail-delete:hover {
            background: #ffe2e2;
        }

        .cal-detail-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #f0f4f8;
        }

        #cal-detail-add {
            background: #3788d8;
            color: #ffffff;
            border: none;
            border-radius: 9px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(55, 136, 216, 0.3);
        }

        #cal-detail-add:hover {
            background: #2563ae;
            box-shadow: 0 4px 12px rgba(55, 136, 216, 0.4);
        }

        /* ===== ダーク：詳細パネル ===== */
        #cal-detail-overlay.dark-overlay {
            background: rgba(0, 0, 0, 0.65);
        }

        .dark-detail #cal-detail-box,
        body.dark #cal-detail-box {
            background: #1e293b !important;
            border-color: #334155 !important;
            color: #e2e8f0 !important;
        }

        .dark-detail #cal-detail-box h4,
        body.dark #cal-detail-box h4 {
            color: #f1f5f9 !important;
        }

        .dark-detail #cal-detail-close,
        body.dark #cal-detail-close {
            background: rgba(255, 255, 255, 0.08) !important;
            color: #94a3b8 !important;
        }

        .dark-detail #cal-detail-close:hover,
        body.dark #cal-detail-close:hover {
            background: rgba(255, 255, 255, 0.15) !important;
            color: #e2e8f0 !important;
        }

        .dark-detail .cal-detail-item,
        body.dark .cal-detail-item {
            background: #0f172a !important;
            border-color: #334155 !important;
        }

        .dark-detail .cal-item-title,
        body.dark .cal-item-title {
            color: #f1f5f9 !important;
        }

        .dark-detail .cal-item-sub,
        body.dark .cal-item-sub {
            color: #94a3b8 !important;
        }

        .dark-detail .cal-item-memo.memo-test,
        body.dark .cal-item-memo.memo-test {
            background: rgba(239, 68, 68, 0.13) !important;
            color: #fca5a5 !important;
            border-left-color: #ef4444 !important;
        }

        .dark-detail .cal-item-memo.memo-assignment,
        body.dark .cal-item-memo.memo-assignment {
            background: rgba(251, 191, 36, 0.10) !important;
            color: #fcd34d !important;
            border-left-color: #f59e0b !important;
        }

        .dark-detail .cal-item-memo.memo-other,
        body.dark .cal-item-memo.memo-other {
            background: rgba(255, 255, 255, 0.05) !important;
            color: #94a3b8 !important;
            border-left-color: #475569 !important;
        }

        .dark-detail .cal-detail-edit,
        body.dark .cal-detail-edit {
            background: rgba(56, 139, 240, 0.15) !important;
            color: #bfdbfe !important;
            border-color: rgba(96, 165, 250, 0.4) !important;
        }

        .dark-detail .cal-detail-edit:hover,
        body.dark .cal-detail-edit:hover {
            background: rgba(56, 139, 240, 0.25) !important;
        }

        .dark-detail .cal-detail-delete,
        body.dark .cal-detail-delete {
            background: rgba(239, 68, 68, 0.12) !important;
            color: #fca5a5 !important;
            border-color: rgba(239, 68, 68, 0.3) !important;
        }

        .dark-detail .cal-detail-delete:hover,
        body.dark .cal-detail-delete:hover {
            background: rgba(239, 68, 68, 0.22) !important;
        }

        .dark-detail .cal-detail-actions,

<body>
<style>
.demo-notice{box-sizing:border-box;max-width:1120px;margin:16px auto;padding:14px 18px;border:1px solid #bdd6d0;border-radius:14px;background:#eff8f5;color:#174a41;font:14px/1.65 system-ui,sans-serif;display:flex;gap:16px;align-items:center;justify-content:space-between}
.demo-notice strong{display:block;font-size:16px}.demo-notice p{margin:3px 0 0}.demo-notice button{flex-shrink:0;background:white;color:#174a41;border:1px solid #87aaa1;border-radius:8px;padding:9px 12px;cursor:pointer;font:inherit}.demo-notice button:focus-visible{outline:3px solid #146b56;outline-offset:3px}
@media(max-width:600px){.demo-notice{margin:8px;align-items:flex-start;flex-direction:column;gap:8px}}
@media(prefers-color-scheme:dark){.demo-notice{background:#162b26;color:#d8efe8;border-color:#47685e}.demo-notice button{background:#233e35;color:#d8efe8;border-color:#729b8d}}
</style>
<aside class="demo-notice" aria-label="体験版について"><div><strong>学校カレンダー · 体験版</strong><p>予定はこのブラウザーだけに保存されます。他の人や学校の共有DBとは同期しません。架空の情報でお試しください。</p></div><button id="demo-reset" type="button">体験データをリセット</button></aside>

<div id="cal-app">
        <div id="cal-header">
            <h2>学校カレンダー</h2>
            <button id="cal-btn-open" type="button" onclick="calOpenForm(null)">＋ 予定を追加</button>
        </div>

        <div id="cal-form-panel">
            <h3><span id="cal-form-header-text">予定を追加</span> <button id="cal-btn-close" type="button" onclick="calCloseForm()">×</button></h3>
            <div id="cal-form-subtitle" class="cal-form-subtitle">新しい予定を追加します。</div>
            <div class="cal-form-grid">
                <div class="cal-form-group full">
                    <label>タイトル *</label>
                    <input type="text" id="cal-f-title" placeholder="例：数学テスト、体育祭" oninput="calOnTitleInput(this.value)">
                </div>
                <div class="cal-form-group">
                    <label>種類</label>
                    <select id="cal-f-type" class="cal-native-control" tabindex="-1" aria-hidden="true" onchange="calOnTypeChange(this.value)">
                        <option value="event">学校行事</option>
                        <option value="assignment">提出物</option>
                        <option value="test">テスト予定</option>
                        <option value="other">その他</option>
                    </select>
                    <div id="cal-type-control" class="cal-custom-control">
                        <button id="cal-type-trigger" class="cal-custom-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="cal-type-popup">
                            <span id="cal-type-display">学校行事</span><span class="cal-custom-trigger-icon cal-select-chevron" aria-hidden="true"></span>
                        </button>
                        <div id="cal-type-popup" class="cal-custom-popup cal-select-popup" role="listbox" aria-label="種類">
                            <button class="cal-select-option" type="button" role="option" aria-selected="true" data-value="event">学校行事</button>
                            <button class="cal-select-option" type="button" role="option" aria-selected="false" data-value="assignment">提出物</button>
                            <button class="cal-select-option" type="button" role="option" aria-selected="false" data-value="test">テスト予定</button>
                            <button class="cal-select-option" type="button" role="option" aria-selected="false" data-value="other">その他</button>
                        </div>
                    </div>
                </div>
                <div class="cal-form-group">
                    <label>日付 *</label>
                    <input type="date" id="cal-f-date" class="cal-native-control" tabindex="-1" aria-hidden="true" onchange="calUpdatePeriodSuggestion(true)" oninput="calUpdatePeriodSuggestion(true)">
                    <div id="cal-date-control" class="cal-custom-control">
                        <button id="cal-date-trigger" class="cal-custom-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="cal-date-popup">
                            <span id="cal-date-display" class="cal-custom-trigger-placeholder">日付を選択</span><span class="cal-custom-trigger-icon cal-date-icon" aria-hidden="true"></span>
                        </button>
                        <div id="cal-date-popup" class="cal-custom-popup cal-date-picker" role="dialog" aria-label="日付を選択">
                            <div class="cal-date-picker-header">
                                <button id="cal-date-prev" class="cal-date-nav cal-date-prev" type="button" aria-label="前月"></button>
                                <div id="cal-date-picker-title" class="cal-date-picker-title" aria-live="polite"></div>
                                <button id="cal-date-today" class="cal-date-today" type="button">今日</button>
                                <button id="cal-date-next" class="cal-date-nav cal-date-next" type="button" aria-label="次月"></button>
                            </div>
                            <div class="cal-date-weekdays" aria-hidden="true"><span class="cal-date-weekday">日</span><span class="cal-date-weekday">月</span><span class="cal-date-weekday">火</span><span class="cal-date-weekday">水</span><span class="cal-date-weekday">木</span><span class="cal-date-weekday">金</span><span class="cal-date-weekday">土</span></div>
                            <div id="cal-date-grid" class="cal-date-grid" role="grid" aria-label="日付"></div>
                        </div>
                    </div>
                    <input type="hidden" id="cal-f-event-id" value="">
                </div>
                <div class="cal-form-group full">
                    <label>時間指定</label>
                    <div class="cal-time-tabs">
                        <div class="cal-time-tab active" data-mode="allday" onclick="calSetTimeMode('allday')">終日</div>
                        <div class="cal-time-tab" data-mode="clock" onclick="calSetTimeMode('clock')">時刻指定</div>
                        <div class="cal-time-tab" data-mode="period" onclick="calSetTimeMode('period')">時限指定</div>
                    </div>
                    <div id="cal-period-suggestion" role="status" aria-live="polite">
                        <div class="cal-period-suggestion-title" id="cal-period-suggestion-text"></div>
                        <div class="cal-period-suggestion-actions">
                            <button id="cal-period-suggestion-apply" type="button" onclick="calApplyPeriodSuggestion()">この時限にする</button>
                            <label class="cal-period-auto-label"><input type="checkbox" id="cal-period-auto-check" onchange="calSetAutoPeriodPreference(this.checked)">次回から候補を自動で適用</label>
                        </div>
                    </div>
                    <div id="cal-time-clock" style="display:none;">
                        <div class="cal-form-grid">
                            <div class="cal-form-group">
                                <label>開始時刻</label>
                                <input type="time" id="cal-f-start-time" class="cal-native-control" tabindex="-1" aria-hidden="true" value="09:00">
                                <div id="cal-start-time-control" class="cal-custom-control cal-time-control">
                                    <button id="cal-start-time-trigger" class="cal-custom-trigger cal-time-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="cal-start-time-popup">
                                        <span id="cal-start-time-display">09 : 00</span><span class="cal-custom-trigger-icon cal-time-icon" aria-hidden="true"></span>
                                    </button>
                                    <div id="cal-start-time-popup" class="cal-custom-popup cal-time-picker cal-portal-popup" role="dialog" aria-label="開始時刻を選択">
                                        <div class="cal-time-picker-columns">
                                            <div class="cal-time-wheel-indicator" aria-hidden="true"></div>
                                            <div class="cal-time-picker-column"><div class="cal-time-picker-label">時</div><div id="cal-start-time-hours" class="cal-time-picker-list" role="listbox" aria-label="開始時刻の時"></div></div>
                                            <div class="cal-time-picker-column"><div class="cal-time-picker-label">分</div><div id="cal-start-time-minutes" class="cal-time-picker-list" role="listbox" aria-label="開始時刻の分"></div></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="cal-form-group">
                                <label>終了時刻</label>
                                <input type="time" id="cal-f-end-time" class="cal-native-control" tabindex="-1" aria-hidden="true" value="10:00">
                                <div id="cal-end-time-control" class="cal-custom-control cal-time-control">
                                    <button id="cal-end-time-trigger" class="cal-custom-trigger cal-time-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="cal-end-time-popup">
                                        <span id="cal-end-time-display">10 : 00</span><span class="cal-custom-trigger-icon cal-time-icon" aria-hidden="true"></span>
                                    </button>
                                    <div id="cal-end-time-popup" class="cal-custom-popup cal-time-picker cal-portal-popup" role="dialog" aria-label="終了時刻を選択">
                                        <div class="cal-time-picker-columns">
                                            <div class="cal-time-wheel-indicator" aria-hidden="true"></div>
                                            <div class="cal-time-picker-column"><div class="cal-time-picker-label">時</div><div id="cal-end-time-hours" class="cal-time-picker-list" role="listbox" aria-label="終了時刻の時"></div></div>
                                            <div class="cal-time-picker-column"><div class="cal-time-picker-label">分</div><div id="cal-end-time-minutes" class="cal-time-picker-list" role="listbox" aria-label="終了時刻の分"></div></div>
                                        </div>
                                    </div>
                                </div>
                                <label class="cal-no-end-label"><input type="checkbox" id="cal-f-no-end" onchange="calSetNoEndTime(this.checked)">終了時刻を指定しない</label>
                            </div>
                        </div>
                    </div>
                    <div id="cal-time-period" style="display:none;">
                        <div class="cal-form-group">
                            <label>時限</label>
                            <select id="cal-f-period" class="cal-native-control" tabindex="-1" aria-hidden="true" onchange="calAutoPeriodApplied=false;calUpdatePeriodSuggestion()">
                                <option value="1">1限</option>
                                <option value="2">2限</option>
                                <option value="3">3限</option>
                                <option value="4">4限</option>
                                <option value="5">5限</option>
                                <option value="6">6限</option>
                            </select>
                            <div id="cal-period-control" class="cal-custom-control">
                                <button id="cal-period-trigger" class="cal-custom-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="cal-period-popup">
                                    <span id="cal-period-display">1限</span><span class="cal-custom-trigger-icon cal-select-chevron" aria-hidden="true"></span>
                                </button>
                                <div id="cal-period-popup" class="cal-custom-popup cal-select-popup cal-period-popup cal-portal-popup" role="listbox" aria-label="時限">

        function calGetHeight() {
            var viewportH = window.innerHeight || document.documentElement.clientHeight || 700;
            var viewportW = window.innerWidth || document.documentElement.clientWidth || 360;
            // ページ上部のヘッダー＋フォームパネル分の高さを引いて残りをカレンダーに使う
            var headerEl = document.getElementById('cal-header');
            var formEl = document.getElementById('cal-form-panel');
            var headerH = headerEl ? headerEl.offsetHeight + 12 : 56;
            var formH = formEl ? (formEl.classList.contains('open') ? formEl.offsetHeight + 12 : 0) : 0;
            var appPad = viewportW < 520 ? 16 : 28;
            var bottomPad = viewportW < 520 ? 14 : 24;
            var used = headerH + formH + appPad + bottomPad;
            var available = viewportH - used;
            var minHeight = viewportW < 520 ? 320 : 440;
            var maxHeight = viewportH * 0.88;
            return Math.round(Math.min(maxHeight, Math.max(minHeight, available)));
        }

                .replace(/</g, amp + 'lt;')
                .replace(/>/g, amp + 'gt;')
                .replace(/"/g, amp + 'quot;')
                .replace(/'/g, amp + '#039;');

                var response = await fetch(calEventsApiUrl + '?watch=' + Date.now(), { cache: 'no-store' });
                var events = await response.json();
                if (!Array.isArray(events)) return;
                var nextSignature = calBuildEventsSignature(events);
                if (!calEventsSignature) { calEventsSignature = nextSignature; return; }
                if (nextSignature !== calEventsSignature) {
                    calEventsSignature = nextSignature;
                    calCalendar.refetchEvents();
                    if (calCurrentDetailDate) { setTimeout(function () { calRenderDayDetail(calCurrentDetailDate); }, 300); }
                }
            } catch (e) { }
        }

        function calNormalizeSubjectText(value) {
            var text = String(value || '').toLowerCase();
            if (text.normalize) text = text.normalize('NFKC');
            text = text.replace(/[ァ-ン]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0x60); });
            text = text.replace(/Ⅲ|ⅲ|iii/g, '3').replace(/Ⅱ|ⅱ|ii/g, '2').replace(/Ⅰ|ⅰ|i/g, '1');
            text = text.replace(/一/g, '1').replace(/二/g, '2').replace(/三/g, '3');
            return text.replace(/[\s　・･\-/／]/g, '');
        }

        function calDetectSubjectFromText(title, memo) {
            var text = calNormalizeSubjectText((title || '') + ' ' + (memo || ''));
            for (var i = 0; i < calSubjectKeywordRules.length; i++) {
                var rule = calSubjectKeywordRules[i];
                for (var j = 0; j < rule.words.length; j++) {
                    if (text.indexOf(calNormalizeSubjectText(rule.words[j])) !== -1) {
                        return rule.subject;
                    }
                }
            }
            return '';
        }

        function calFindSubjectPeriodOnDate(subject, dateKey) {
            if (!subject || !dateKey) return null;
            var date = new Date(dateKey + 'T00:00:00');
            if (isNaN(date.getTime())) return null;
            var dow = date.getDay();
            if (dow < 1 || dow > 5) return null;
            var dayIndex = dow - 1;
            for (var period = 1; period <= 6; period++) {
                if (calSubjectTimetable[period]) {
                if (calSubjectTimetable[period][dayIndex] === subject) {
                    return String(period);
                }
                }
            }
            return null;
        }

        function calAutoPeriodFromSubject(title, memo, dateKey) {
            var subject = calDetectSubjectFromText(title, memo);
            if (!subject) return null;
            if (!dateKey) return null;
            var period = calFindSubjectPeriodOnDate(subject, dateKey);
            return { subject: subject, period: period };
        }

        function calGetAutoPeriodPreference() {

            catch (e) { return false; }

        function calHidePeriodSuggestion() {

        function calUpdatePeriodSuggestion(allowAutoApply) {
            var box = document.getElementById('cal-period-suggestion');
            var text = document.getElementById('cal-period-suggestion-text');
            var applyButton = document.getElementById('cal-period-suggestion-apply');
            var actions = box ? box.querySelector('.cal-period-suggestion-actions') : null;
            var check = document.getElementById('cal-period-auto-check');
            if (check) check.checked = calGetAutoPeriodPreference();
            if (!box || !text) return;
            var inputs = calGetPeriodSuggestionInputs();
            var suggestion = calAutoPeriodFromSubject(inputs.title, inputs.memo, inputs.date);
            if (!suggestion) {
                calHidePeriodSuggestion();
                return;
            }
            calCurrentPeriodSuggestion = suggestion;
            if (!suggestion.period) {
                text.textContent = 'この日は通常、' + suggestion.subject + 'の授業がありません。日付をご確認ください。';
                box.classList.remove('applied');
                box.classList.add('missing');
                if (actions) actions.style.display = 'none';
                box.classList.add('show');
                return;
            }
            var periodSelect = document.getElementById('cal-f-period');
            var currentPeriod = periodSelect ? periodSelect.value : '';
            var isSuggestedSetting = calCurrentTimeMode === 'period' ? currentPeriod === suggestion.period : false;
            if (actions) actions.style.display = 'flex';
            if (isSuggestedSetting) {
                text.textContent = suggestion.subject + 'は、この日の' + suggestion.period + '限に設定されています。';
                box.classList.remove('missing');
                box.classList.add('applied');
                if (applyButton) applyButton.style.display = 'none';
            } else {
                text.textContent = suggestion.subject + 'は、この日の' + suggestion.period + '限にあります。時限指定に反映できます。';
                box.classList.remove('applied', 'missing');
                if (applyButton) applyButton.style.display = '';
            }
            box.classList.add('show');
            if (allowAutoApply ? calGetAutoPeriodPreference() : false) {
                if (calCurrentTimeMode === 'allday' || calAutoPeriodApplied) {
                    calApplyPeriodSuggestion(true);
                }
            }
        }

        function calApplyPeriodSuggestion(isAuto) {
            if (!calCurrentPeriodSuggestion) calUpdatePeriodSuggestion();
            if (!calCurrentPeriodSuggestion) return;
            if (!calCurrentPeriodSuggestion.period) return;
            if (isAuto ? calCurrentTimeMode === 'clock' : false) return;
            if (isAuto ? (calCurrentTimeMode === 'period' ? !calAutoPeriodApplied : false) : false) return;
            calSetTimeMode('period');
            var periodSelect = document.getElementById('cal-f-period');
            if (periodSelect) periodSelect.value = calCurrentPeriodSuggestion.period;
            calSyncPeriodControl();
            calAutoPeriodApplied = true;
            calUpdatePeriodSuggestion();
            calRefreshCalendarHeight(80);
        }

        async function calLoadHolidays(year) {
            try {
                var res = await fetch('https://holidays-jp.github.io/api/v1/' + year + '/date.json');
                var data = await res.json();
                document.querySelectorAll('#cal-calendar [data-date]').forEach(function (cell) {
                    cell.classList.remove('cal-holiday');
                    var frame = cell.querySelector('.fc-daygrid-day-frame');
                    if (frame) frame.classList.remove('cal-holiday');
                    var dayNumber = cell.querySelector('.fc-daygrid-day-number');
                    if (dayNumber) {
                        dayNumber.removeAttribute('data-holiday-name');
                    }
                });
                Object.keys(data).forEach(function (date) {
                    var el = document.querySelector('[data-date="' + date + '"]');
                    if (el) {
                        el.classList.add('cal-holiday');
                        var frame = el.querySelector('.fc-daygrid-day-frame');
                        if (frame) frame.classList.add('cal-holiday');
                        var dayNumber = el.querySelector('.fc-daygrid-day-number');
                        if (dayNumber) {
                            dayNumber.dataset.holidayName = data[date];
                        }
                    }
                });
            } catch (e) {
                console.log('holiday load failed');
            }
        }

        function calMarkWeekends() {
            document.querySelectorAll('#cal-calendar .fc-daygrid-day[data-date]').forEach(function (cell) {
                cell.classList.remove('cal-weekend-sat', 'cal-weekend-sun');
                var frame = cell.querySelector('.fc-daygrid-day-frame');
                if (frame) {
                    frame.classList.remove('cal-weekend-sat', 'cal-weekend-sun');
                }
                var dateValue = cell.getAttribute('data-date');
                if (!dateValue) return;
                var d = new Date(dateValue + 'T00:00:00');
                if (isNaN(d.getTime())) return;
                var day = d.getDay();
                if (day === 6) {
                    cell.classList.add('cal-weekend-sat');
                    if (frame) frame.classList.add('cal-weekend-sat');
                } else if (day === 0) {
                    cell.classList.add('cal-weekend-sun');
                    if (frame) frame.classList.add('cal-weekend-sun');
                }
            });
        }

        function calFindDetailCardByEventId(eventId) {

            for (var i = 0; i < buttons.length; i++) {

                }
            }

        function calAnimateDeletedDetailCard(eventId) {
            return new Promise(function (resolve) {
                var card = calFindDetailCardByEventId(eventId);
                if (!card) {
                    resolve();
                    return;
                }


                var finished = false;
                function finishRemoval() {
                    if (finished) return;
                    finished = true;
                    card.removeEventListener('transitionend', handleRemovalTransitionEnd);
                    if (card.parentNode) card.parentNode.removeChild(card);
                    resolve();
                }

                function handleRemovalTransitionEnd(event) {
                    if (event.propertyName === 'max-height') finishRemoval();
                }

                card.style.maxHeight = card.offsetHeight + 'px';
                card.style.overflow = 'hidden';
                card.addEventListener('transitionend', handleRemovalTransitionEnd);


                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        card.classList.add('cal-detail-item-removing');
                    });
                });
                setTimeout(finishRemoval, 340);
            });
        }

        async function calDeleteEventNow(eventId, title) {
            if (!eventId) return;
            try {
                calSetSubmitting(true);
                calShowStatusOverlay('削除しています...', 'loading');
                var loadingStartedAt = Date.now();
                var response = await fetch(calDeleteApiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ id: eventId })
                });
                var result = await calReadJsonResponse(response);
                var loadingElapsed = Date.now() - loadingStartedAt;
                if (loadingElapsed < 500) await calWait(500 - loadingElapsed);
                if (result.success) {
                    calShowStatusOverlay('削除しました', 'success');
                    calEventsSignature = '';
                    calCalendar.refetchEvents();
                    setTimeout(async function () {
                        calHideStatusOverlay();
                        await calAnimateDeletedDetailCard(eventId);
                        setTimeout(function () { if (calCurrentDetailDate) calRenderDayDetail(calCurrentDetailDate); }, 80);
                    }, 1000);
                } else {
                    calShowStatusOverlay('削除に失敗しました', 'error');
                    setTimeout(calHideStatusOverlay, 1500);
                }
            } catch (e) {
                calShowStatusOverlay('通信エラーが発生しました', 'error');
                setTimeout(calHideStatusOverlay, 1500);
            } finally {
                calSetSubmitting(false);
            }
        }

        async function calExecuteSubmit(params) {
            var eventId = params.get('id') || '';
            try {
                calSetSubmitting(true);
                calShowStatusOverlay('センタ通信中...', 'loading');
                var loadingStartedAt = Date.now();
                var requestUrl = eventId ? './api/update_event.php' : calAddApiUrl;
                var response = await fetch(requestUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });
                var result = await calReadJsonResponse(response);
                var loadingElapsed = Date.now() - loadingStartedAt;
                if (loadingElapsed < 500) await calWait(500 - loadingElapsed);
                if (result.success) {
                    calShowStatusOverlay('完了しました', 'success');
                    calEventsSignature = '';
                    calCalendar.refetchEvents();
                    document.getElementById('cal-f-title').value = '';
                    document.getElementById('cal-f-memo').value = '';
                    document.getElementById('cal-memo-group').style.display = 'none';
                    calSetTimeMode('allday');
                    setTimeout(function () {
                        calCloseForm();
                        calHideStatusOverlay();
                        setTimeout(function () { calScrollToElement(document.getElementById('cal-wrap'), 90); calRefreshCalendarHeight(100); }, 500);
                    }, 1000);
                } else {
                    calHideStatusOverlay();
                    calShowFormMessage('error', (eventId ? '更新' : '追加') + 'に失敗しました。' + (result.error ? ' ' + result.error : ''));
                }
            } catch (e) {
                calHideStatusOverlay();
                calShowFormMessage('error', '通信エラーが発生しました。時間をおいてもう一度試してください。');
            } finally {
                calSetSubmitting(false);
            }
        }

        async function calSubmitForm() {
            calClearFormMessage();
            var title = document.getElementById('cal-f-title').value.trim();
            var date = document.getElementById('cal-f-date').value;
            var type = document.getElementById('cal-f-type').value;
            var memo = document.getElementById('cal-f-memo').value.trim();
            if (!title) { calShowFormMessage('error', 'タイトルを入力してください。'); calScrollToElement(document.getElementById('cal-form-panel'), 90); return; }
            if (!date) { calShowFormMessage('error', '日付を選択してください。カレンダーの日付をタップすると自動入力できます。'); calScrollToElement(document.getElementById('cal-form-panel'), 90); return; }
            var start = date + ' 00:00:00';
            var end = date + ' 00:00:00';
            var period = null;
            if (calCurrentTimeMode === 'clock') {
                var startTime = document.getElementById('cal-f-start-time').value;
                var endTime = document.getElementById('cal-f-end-time').value;
                var noEndTime = calHasNoEndTime();
                if (!startTime) { calShowFormMessage('error', '開始時刻を入力してください。'); calScrollToElement(document.getElementById('cal-form-panel'), 90); return; }
                if (!noEndTime) {
                    if (!endTime) { calShowFormMessage('error', '終了時刻を入力してください。'); calScrollToElement(document.getElementById('cal-form-panel'), 90); return; }
                    if (calTimeValueToMinutes(startTime) >= calTimeValueToMinutes(endTime)) { calShowFormMessage('error', '終了時刻は開始時刻より後に設定してください。'); calScrollToElement(document.getElementById('cal-form-panel'), 90); return; }
                }
                start = date + ' ' + startTime + ':00';
                end = noEndTime ? '' : date + ' ' + endTime + ':00';
            } else if (calCurrentTimeMode === 'period') {
                period = document.getElementById('cal-f-period').value;
            }
            var eventId = document.getElementById('cal-f-event-id').value.trim();
            var params = new URLSearchParams({ title: title, start: start, end: end, color: calCurrentColor, event_type: type, time_mode: calCurrentTimeMode });
            if (period) params.append('period', period);
            if (memo) params.append('memo', memo);
            if (eventId) params.append('id', eventId);
            if (eventId) {
                calShowUpdateOverlay(params);
                return;
            }
            await calExecuteSubmit(params);
        }

            var parts = calGetTimeParts(input.value);

            if (input.value === nextValue) return;

            input.dispatchEvent(new Event('input', { bubbles: true }));

        function calSelectNearestTimeWheelValue(key, part, lastDirection) {
            var config = calGetTimePickerConfig(key);
            if (!config) return;
            var listId = part === 'hour' ? config.hoursId : config.minutesId;
            var list = document.getElementById(listId);
            if (!list) return;
            var options = Array.from(list.querySelectorAll('.cal-time-option')).filter(function (option) { return !option.disabled; });
            if (!options.length) return;
            var listRect = list.getBoundingClientRect();
            var center = listRect.top + (list.clientHeight / 2);
            var nearest = options[0];
            var nearestDistance = Number.MAX_SAFE_INTEGER;
            var nearestCenter = 0;
            var tieTolerance = 0.75;
            options.forEach(function (option) {
                var optionRect = option.getBoundingClientRect();
                var optionCenter = optionRect.top + (optionRect.height / 2);
                var distance = Math.abs(optionCenter - center);
                if (distance < nearestDistance) {
                    nearest = option;
                    nearestDistance = distance;
                    nearestCenter = optionCenter;
                    return;
                }
                if (Math.abs(distance - nearestDistance) <= tieTolerance) {
                    if (lastDirection > 0) {
                        if (optionCenter > nearestCenter) {
                            nearest = option;
                            nearestDistance = distance;
                            nearestCenter = optionCenter;
                        }
                    } else if (lastDirection < 0) {
                        if (optionCenter < nearestCenter) {
                            nearest = option;
                            nearestDistance = distance;
                            nearestCenter = optionCenter;
                        }
                    }
                }
            });
            calSetTimeWheelValue(key, part, nearest.dataset.value);
            return calCenterTimeWheel(key, part, 'auto');
        }

        function calIsDiscreteMouseWheel(event) {

        function calMoveTimeWheelByStep(key, part, direction) {
            var config = calGetTimePickerConfig(key);
            if (!config) return false;
            var input = document.getElementById(config.inputId);
            if (!input) return false;
            var listId = part === 'hour' ? config.hoursId : config.minutesId;

            var parts = calGetTimeParts(input.value);
            var currentValue = part === 'hour' ? parts.hour : parts.minute;
            var currentIndex = 0;
            for (var index = 0; index < options.length; index += 1) {
                if (options[index].dataset.value === currentValue) {
                    currentIndex = index;
                    break;
                }
            }
            var nextIndex = currentIndex + direction;
            if (nextIndex < 0) nextIndex = 0;
            if (nextIndex >= options.length) nextIndex = options.length - 1;
            while (options[nextIndex].disabled) {
                nextIndex += direction;
                if (nextIndex < 0) return false;
                if (nextIndex >= options.length) return false;
            }
            if (nextIndex === currentIndex) return false;
            calSetTimeWheelValue(key, part, options[nextIndex].dataset.value);
            return calCenterTimeWheel(key, part, 'auto');
        }

        function calPositionPortalPopup(controlId, popupId) {
            var control = document.getElementById(controlId);
            var popup = document.getElementById(popupId);
            if (!control) return;
            if (!popup) return;
            if (!control.classList.contains('open')) return;
            var trigger = control.querySelector('.cal-custom-trigger');
            if (!trigger) return;
            var viewportMargin = 12;
            var popupGap = 7;
            var triggerRect = trigger.getBoundingClientRect();
            var popupRect = popup.getBoundingClientRect();
            var left = triggerRect.left;
            if (left + popupRect.width > window.innerWidth - viewportMargin) {
                left = window.innerWidth - viewportMargin - popupRect.width;
            }
            if (left < viewportMargin) left = viewportMargin;
            var availableBelow = window.innerHeight - triggerRect.bottom - viewportMargin - popupGap;
            var availableAbove = triggerRect.top - viewportMargin - popupGap;
            var openUp = popupRect.height > availableBelow;
            if (openUp) {
                if (availableAbove <= availableBelow) openUp = false;
            }
            var top = triggerRect.bottom + popupGap;
            popup.classList.remove('open-up');
            if (openUp) {
                top = triggerRect.top - popupRect.height - popupGap;
                popup.classList.add('open-up');
            }
            if (top < viewportMargin) top = viewportMargin;
            if (top + popupRect.height > window.innerHeight - viewportMargin) {
                top = Math.max(viewportMargin, window.innerHeight - viewportMargin - popupRect.height);
            }
            popup.style.left = Math.round(left) + 'px';
            popup.style.top = Math.round(top) + 'px';
        }

        function calLoadDatePickerHolidays(year) {

            fetch('https://holidays-jp.github.io/api/v1/' + year + '/date.json')

                .then(function (data) {
